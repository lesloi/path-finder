name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

      # Fails below the coverage threshold set in vitest.config.ts.
      - run: pnpm test:coverage | tee "$RUNNER_TEMP/coverage.txt"
        shell: bash

      - name: Write coverage to the job summary
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            # Keep the coverage table only, without ANSI colors.
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/coverage.txt" | grep -E '^(-|.*\|)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        with:
          name: coverage
          path: coverage/

      - run: pnpm test:integration
      - run: pnpm build

  # Builds the image on every run, and pushes it to GitHub Container Registry from main.
  docker:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
