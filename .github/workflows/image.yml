name: Image

# The image is built once, here: a pull request builds it without pushing it, and the release calls this workflow to
# push it. The checks and tests never run the steps that only the Dockerfile takes (the contract copied into the build,
# the Alpine runtime, the unprivileged user), so a Dockerfile that breaks must break on the pull request, not on the
# release that was supposed to publish it.
on:
  pull_request:
  workflow_call:
    inputs:
      push:
        description: Push the image to GitHub Container Registry.
        type: boolean
        default: false
    outputs:
      digest:
        description: Digest of the pushed image.
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  # The release that calls this workflow pushes the image, and a called workflow can only narrow the permissions of its
  # caller. A pull request never pushes, and GitHub caps the token of one from a fork at read whatever this says.
  packages: write

# A new push to a pull request cancels the run it replaces. Called by the release on `main`, the event is the release's,
# so nothing is cancelled: a release is never interrupted.
concurrency:
  group: ${{ github.workflow }}-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    # A hang fails fast instead of running for hours; a cold build takes minutes.
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        if: inputs.push
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Built and thrown away on a pull request: no tag, no registry, no credentials. The cache is the one the release
      # fills, so a pull request only pays for the layers it changes. One architecture only: arm64 is not needed, so the
      # build runs natively on the runner, without qemu.
      - id: build
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
