name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The static checks of the whole project, which are quick: formatting of every file, lint and types of
  # the web app, `gofmt` and `go vet` of the server.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
      - run: pnpm check
