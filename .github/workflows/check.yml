name: Check

# On `main` the workflow runs inside `release.yml`, which deploys only once it has passed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. The workflow name in the group keeps it distinct
# from the one of `release.yml` (see there).
concurrency:
  group: ${{ github.workflow }}-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The static checks of the whole project, which are quick: formatting of every file, lint and types of
  # the web app, `gofmt` and `go vet` of the server.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
      - run: pnpm check
