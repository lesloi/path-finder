name: Server

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The unit and integration tests, with the race detector, then the coverage threshold of apps/server/coverage.sh.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
      - run: apps/server/test.sh unit
      - run: apps/server/test.sh integration
      - run: apps/server/coverage.sh
