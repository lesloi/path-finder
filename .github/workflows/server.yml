name: Server

# On `main` the workflow runs inside `release.yml`, which deploys only once it has passed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. The workflow name in the group keeps it distinct
# from the one of `release.yml` (see there).
concurrency:
  group: ${{ github.workflow }}-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The binary builds as in the image, then the unit tests with their coverage threshold (scripts/coverage-server.sh), then the
  # integration tests with the race detector.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null .
        working-directory: apps/server
      - run: scripts/coverage-server.sh
      - run: scripts/test-server.sh integration
