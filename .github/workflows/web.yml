name: Web

# On `main` the workflow runs inside `release.yml`, which deploys only once it has passed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. The workflow name in the group keeps it distinct
# from the one of `release.yml` (see there).
concurrency:
  group: ${{ github.workflow }}-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The unit tests with their coverage threshold, then the app built (`pnpm build`, `go build`) and tested in Chromium served by the Go server; the IGN
  # is answered from fixtures (e2e/test.ts).
  web:
    runs-on: ubuntu-latest
    # A hang fails fast instead of running for hours; the tests take minutes.
    timeout-minutes: 15
    # The image holds the browser and the system libraries it needs, so no `apt` runs in the job (a slow mirror once took
    # 8 minutes). The tag must match the `@playwright/test` version of the lockfile; a mismatch fails with an explicit error.
    # `--ipc=host`: the default 64 MB of shared memory crashes Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # The workspace belongs to another user than the container's root, so Go would refuse to read its Git status.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      # Fails below the coverage threshold set in vitest.config.ts.
      - run: pnpm coverage:web | tee "$RUNNER_TEMP/web.txt"
        shell: bash

      - name: Write coverage to the job summary
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            # Keep the coverage table only, without ANSI colors.
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/web.txt" | grep -E '^(-|.*\|)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        with:
          name: coverage
          path: coverage/

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
