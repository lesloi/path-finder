name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time on main. A run waiting behind the running one is replaced by a newer push, which is fine: only the
# latest commit is tested and deployed, and it contains the others.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks and tests run here on `main`, so that nothing is published or deployed before they pass. A called workflow
  # sees this workflow's name in `github.workflow`, so their concurrency groups carry their own name to stay distinct from
  # this one. The quick check goes first, so a failure does not leave the long jobs running.
  check:
    uses: ./.github/workflows/check.yml
  web:
    needs: check
    uses: ./.github/workflows/web.yml
  server:
    needs: check
    uses: ./.github/workflows/server.yml

  # Builds the image once (workflow `image`) and hands its digest to the deploy; the pull requests build the same image
  # without pushing it, so a broken Dockerfile fails there rather than on the release.
  container:
    needs: [check, web, server]
    uses: ./.github/workflows/image.yml
    with:
      push: true
    # The called workflow pushes to the registry; it declares the same permissions, which a callee cannot raise.
    permissions:
      contents: read
      packages: write

  # Rolls the pushed image out to the cluster by its digest; it waits for the variable K8S_NAMESPACE, so nothing fails before
  # the cluster exists. The names of the objects default to the manifests of the cluster.
  deploy:
    needs: container
    if: vars.K8S_NAMESPACE != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT || 'path-finder' }}
      CONTAINER: ${{ vars.K8S_CONTAINER || 'server' }}
      CRONJOB: ${{ vars.K8S_CRONJOB || 'path-finder-data' }}
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.container.outputs.digest }}
    steps:
      - name: Write the kubeconfig
        run: |
          (umask 077 && printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig")
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # The data job runs the same image, so a release that changes the graph format rebuilds it with the new binary.
      - name: Update the data job
        run: kubectl --namespace "$NAMESPACE" set image "cronjob/$CRONJOB" "*=${IMAGE,,}"

      # A rollout that is not ready in time is undone.
      - name: Roll out
        run: |
          kubectl --namespace "$NAMESPACE" set image "deployment/$DEPLOYMENT" "$CONTAINER=${IMAGE,,}"
          if ! kubectl --namespace "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=5m; then
            kubectl --namespace "$NAMESPACE" rollout undo "deployment/$DEPLOYMENT"
            exit 1
          fi
