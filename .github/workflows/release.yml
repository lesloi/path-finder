name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the multi-platform image and pushes it to GitHub Container Registry; the pull requests build the app through the e2e tests (workflow `web`).
  container:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Writes the digest of the pushed image in the infrastructure repository, which Flux applies to the cluster; it waits for
  # the variable INFRA_REPOSITORY, so nothing fails before that repository exists.
  deploy:
    needs: container
    if: vars.INFRA_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.INFRA_REPOSITORY }}
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra

      - name: Write the digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          cat > infra/overlays/prod/image/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1alpha1
          kind: Component
          images:
            - name: ${IMAGE,,}
              digest: $DIGEST
          EOF

      - name: Push
        working-directory: infra
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --message "chore: run ${GITHUB_SHA::7}"
          git push || { git pull --rebase && git push; }
