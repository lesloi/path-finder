name: Setup
description: Installs pnpm, Node.js and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 12.6.0
        cache: true

    - uses: actions/setup-node@v7
      with:
        node-version: 26

    - run: pnpm install --frozen-lockfile
      shell: bash
