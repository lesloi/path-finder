version: 2
updates:
  - package-ecosystem: npm
    # pnpm workspace: the root lockfile covers apps/* and e2e.
    directory: /
    versioning-strategy: increase
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # @types/node follows the Node major of the Docker image.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /apps/server
    labels:
      - dependencies
      - api
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
      - infra
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    labels:
      - dependencies
      - infra
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
