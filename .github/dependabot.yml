version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/api
      - /apps/web
      - /e2e
    open-pull-requests-limit: 10
    rebase-strategy: disabled
    versioning-strategy: increase
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    rebase-strategy: disabled
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 10
    rebase-strategy: disabled
    schedule:
      interval: weekly
